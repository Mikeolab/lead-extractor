# Build Windows .exe automatically - no manual CMD needed
# Push code → GitHub builds on Windows → Download the .exe

name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Allow manual "Run workflow" button

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          python -m PyInstaller --clean --noconfirm LeadExtractorPro_windows.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeadExtractorPro-Windows
          path: dist/LeadExtractorPro.exe
